  #     resources:
  #       limits:
  #         memory: 256M
  #         cpus: "0.25"
  #       reservations:
  #         memory: 64M
  #         cpus: "0.05"
  #     labels:
  #       - "traefik.enable=true"
  #       # Portainer via PathPrefix no domínio do MinIO
  #       - "traefik.http.routers.portainer.rule=Host(`${MINIO_HOST}`) && PathPrefix(`/monitoramento`)"
  #       - "traefik.http.routers.portainer.entrypoints=websecure"
  #       - "traefik.http.routers.portainer.tls=true"
  #       - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
  #       - "traefik.http.routers.portainer.service=portainer"
  #       # Middleware para remover o prefixo /monitoramento
  #       - "traefik.http.routers.portainer.middlewares=portainer-stripprefix"
  #       - "traefik.http.middlewares.portainer-stripprefix.stripprefix.prefixes=/monitoramento"
  #       - "traefik.http.services.portainer.loadbalancer.server.port=9000"
  #   command: -H unix:///var/run/docker.sock
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - portainer_data:/data
