# Stack: infra
# Serviços de infraestrutura: Traefik, PostgreSQL, Redis, Portainer
# Deploy: make deploy-infra

services:
  # =============================================================================
  # TRAEFIK - Reverse Proxy & Load Balancer
  # =============================================================================
  traefik:
    image: traefik:v3.6.1
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
      labels:
        - "traefik.enable=true"
        # Dashboard - Protegido por BasicAuth
        - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_HOST}`)"
        - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
        - "traefik.http.routers.traefik-dashboard.tls=true"
        - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
        - "traefik.http.routers.traefik-dashboard.service=api@internal"
        - "traefik.http.services.traefik-dashboard.loadbalancer.server.port=8080"
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/etc/certs
      - traefik_logs:/var/log/traefik
      - ${PROJECT_DIR}/config/traefik/dynamic:/dynamic:ro
    command:
      # Provider Swarm (Traefik v3 - provider separado do Docker)
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=app_net"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      
      # HTTP -> HTTPS Redirect Global
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # Dynamic Config (TLS)
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"

      # API & Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # Logs
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.filepath=/var/log/traefik/access.log"

      # Metrics
      - "--metrics.prometheus=true"

      # Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@seudominio.com.br}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/certs/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    networks:
      - app_net

  # =============================================================================
  # POSTGRESQL - Database (com pgvector para embeddings)
  # =============================================================================
  postgres:
    image: pgvector/pgvector:pg15
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.25"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${PROJECT_DIR}/config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_net

  # =============================================================================
  # REDIS - Cache & Message Queue
  # =============================================================================
  redis:
    image: redis:7-alpine
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  # =============================================================================
  # PORTAINER - Container Management & Monitoring
  # URL: https://${MINIO_HOST}/monitoramento
  # =============================================================================
  # portainer:
  #   image: portainer/portainer-ce:latest
  #   deploy:
  #     mode: replicated
  #     replicas: 1
