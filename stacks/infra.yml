  #     - app_net

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    name: infra_postgres_data
  redis_data:
    name: infra_redis_data
  traefik_certs:
    name: infra_traefik_certs
  traefik_logs:
    name: infra_traefik_logs
  portainer_data:
    name: infra_portainer_data

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  app_net:
    external: true
